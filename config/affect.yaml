# Коэффициент влияния эмоций по горизонтальной оси
valence_factor: 1.0
# Коэффициент влияния эмоций по вертикальной оси
arousal_factor: 1.0
# Параметр сглаживания EMA (0..1)
ema_alpha: 0.5
# Озвучивать ли текущее настроение после ключевых событий.
# Значение ``true`` включает генерацию и проговаривание «муд‑профиля»,
# ``false`` — подавляет голосовые сообщения и оставляет обновление эмоций
# только во внутреннем состоянии.
announce_mood: true
