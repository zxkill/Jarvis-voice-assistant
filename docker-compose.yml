version: "3.9"

# ───────────────────────── СЕРВИСЫ ДЛЯ СБОРА ЛОГОВ ─────────────────────────
# Этот файл поднимает Loki для хранения логов, Promtail для их доставки и
# Grafana для визуализации. Сам Jarvis запускается локально через Python.
services:
  loki:
    image: grafana/loki:2.9.1
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.1
    container_name: promtail
    volumes:
      - ./logs:/var/log/jarvis # монтируем локальные логи ассистента
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.1.2
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    volumes:
      - grafana-data:/var/lib/grafana

# ───────────────────────── ЛОКАЛЬНЫЕ ТОМЫ ─────────────────────────
volumes:
  loki-data:
  grafana-data:
