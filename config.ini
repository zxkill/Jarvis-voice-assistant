[MIC]
; индекс микрофона (-1 для автоматического выбора)
microphone_index = -1

[ROBOT_AUDIO]
; URL WebSocket-сервера, который слушает Python. ESP32 подключается сюда.
endpoint = ws://0.0.0.0:8765/robot
; имя подпротокола WebSocket
subprotocol = robot-audio
; значение заголовка Authorization для аутентификации
authorization =
; keepalive websockets отключен на сервере, эти значения оставлены для совместимости
ping_interval = 0.0
ping_timeout = 0.0
; управляет локальным воспроизведением через динамики ноутбука (true/false)
local_playback = false
; быстрый режим: не отправляем эмоции/SFX в тот же аудиоканал, чтобы они не мешали речи
effects_enabled = false

[AUDIO]
; частота дискретизации входного аудио ESP32 -> сервер
sample_rate = 16000
; максимальная длина очереди буфера
queue_max = 300
; какой канал микрофонов отдавать в Vosk: best / mix / left / right
stt_channel = best
; набор команд для распознавания (full/grammar)
grammar = full

[STT]
; ускорять команду по стабильному partial-result, не ждать финальную паузу Vosk
fast_partial = true
; сколько секунд короткая instant-команда должна не меняться, чтобы считать её сказанной
partial_stable_sec = 0.35
; движение ждём дольше, чтобы фразы «на один метр вперёд» не обрывались на середине
partial_motion_stable_sec = 0.75
; стоп можно принимать почти мгновенно
partial_stop_stable_sec = 0.12
; безопасный режим: ускоряем только очевидно завершённые команды, сомнительные ждут финал Vosk
partial_fast_safe_mode = true
; минимальная длина команды после слова «джарвис»
partial_min_command_chars = 3
; короткая защита от повторного срабатывания на хвосте той же фразы
ignore_after_fast_sec = 0.65
; маленькая задержка только для fast partial, чтобы TTS не стартовал впритык к хвосту вашей фразы
partial_response_guard_sec = 0.12

[TTS]
; короткая тишина перед PCM-речью: защищает от съедания первых букв на MAX98357A
preroll_ms = 120
; скорость отправки TTS относительно реального времени.
; 1.00 = реальное время; меньше = быстрее, больше = медленнее.
; Для длинных ответов безопаснее 1.00, иначе ESP32/Wi‑Fi может рвать WebSocket.
stream_pace = 0.96
; первые миллисекунды PCM отправляются быстрее, чтобы сохранить быстрый старт речи
initial_burst_ms = 650

[DISPLAY]
; имя драйвера дисплея: ``none`` для отключения, ``console`` для терминала или ``serial`` для M5Stack
driver = none

[add_to_prompt]
; фраза, добавляемая к системному промпту
add_to_prompt = 'Ты виртуальный помощник'

[USER]
; имя пользователя/голосового ассистента
name = Jarvis
; идентификатор пользователя Telegram для личных уведомлений (0 отключает)
telegram_user_id =

[INTEL]
; API-ключ для взаимодействия с моделью ИИ (OpenAI, локальный LLM и т.д.)
api_key =
; сколько секунд отсутствия лица считать уходом пользователя
absent_after_sec = 15

[TELEGRAM]
; токен для Telegram-бота (получите у @BotFather)
token =

[PRIVACY]
; интервалы «тихих часов», когда ассистент не будет инициировать диалоги
quiet_hours_start = 23:00
quiet_hours_end = 08:00
; максимальное количество инициатив ассистента в сутки
initiative_limit_per_day = 5

[PRESENCE]
; включить или отключить детектор присутствия пользователя (true/false)
enabled = true
; индекс камеры для захвата видео (0 — первая камера)
camera_index = 0
; интервал между кадрами в миллисекундах
frame_interval_ms = 100
; показывать ли окно с изображением камеры
show_window = true
; поворот кадра для правильно ориентированной камеры
frame_rotation = 0

[EMBEDDINGS]
; профиль эмбеддингов: ``simple`` — хеширование, ``transformer`` — локальная модель
profile = simple

[ANALYSIS]
; включить окно наблюдения за настроением (true/false)
watch_mood = false

[ROBOT_BODY]
; HTTP API ESP32. Можно оставить auto: сервер возьмёт IP из последнего аудио-WebSocket подключения робота.
; Если auto не сработал, укажи явно: base_url = http://192.168.31.xxx
base_url = auto
; Таймауты HTTP-запросов к ESP32
request_timeout_sec = 1.2
status_timeout_sec = 0.8
; Безопасные лимиты для голосового управления. Дальние переезды позже будут через навигацию, не через прямую команду.
max_voice_distance_m = 0.55
max_voice_angle_deg = 90
; Что делать по умолчанию для фраз «вперёд», «назад», «повернись» без числа
default_move_distance_m = 0.25
default_turn_angle_deg = 90
; Безопасный duty для голосовых команд. Если робот не едет — постепенно повышай.
default_move_duty = 900
default_turn_duty = 900
max_duty = 900
; Не отправлять новую команду движения, пока ESP32 говорит busy=true
require_not_busy = true
